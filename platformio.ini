[platformio]
default_envs = roborace-sharp

[env:roborace-sharp]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_speed = 115200

build_flags = -D FREE_RUN_MODE=true -D SHARP_SENSORS=true

lib_deps =
    git@github.com:vakhrymchuk/arduino-base.git
    Servo
;    git@github.com:vakhrymchuk/PWMServo.git
    git@github.com:vakhrymchuk/distance-sensors.git
    PIDController

[env:roborace-vl53]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_speed = 115200

build_flags = -D VL53=true

lib_deps =
    git@github.com:vakhrymchuk/arduino-base.git
    git@github.com:vakhrymchuk/PWMServo.git
    git@github.com:vakhrymchuk/distance-sensors.git
    VL53L0X
    VL53L1X
    TCA9548A

[env:esp32]
platform = espressif32
framework = arduino
board = node32s

build_flags = -D VL53=true

lib_deps =
    ESP32Servo
    ArduinoJson
    ESP Async WebServer
    git@github.com:vakhrymchuk/arduino-base.git
    git@github.com:vakhrymchuk/distance-sensors.git
;    VL53L0X
;    VL53L1X
;    TCA9548A
