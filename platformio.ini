[platformio]
default_envs = roborace-vl53

[env:roborace-sharp]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_speed = 115200

build_flags = -D FREE_RUN_MODE=true -D SHARP_SENSORS=true

lib_deps =
    git@github.com:vakhrymchuk/arduino-base.git
    git@github.com:vakhrymchuk/PWMServo.git
    git@github.com:vakhrymchuk/distance-sensors.git

[env:roborace-vl53]
platform = atmelavr
framework = arduino
board = nanoatmega328

build_flags = -D VL53=true

lib_deps =
    git@github.com:vakhrymchuk/arduino-base.git
    git@github.com:vakhrymchuk/PWMServo.git
    git@github.com:vakhrymchuk/distance-sensors.git
    VL53L0X
    VL53L1X
    TCA9548A
