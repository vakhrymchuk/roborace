[platformio]
default_envs = esp32dev

[env:roborace-sharp]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_speed = 57600
monitor_speed = 115200

build_flags = -D FREE_RUN_MODE=true -D SHARP_SENSORS=true

lib_deps =
    git@github.com:vakhrymchuk/arduino-base.git
    Servo
;    git@github.com:vakhrymchuk/PWMServo.git
    git@github.com:vakhrymchuk/distance-sensors.git
    git@github.com:vakhrymchuk/PIDController.git

[env:roborace-vl53]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_speed = 115200

build_flags = -D VL53=true

lib_deps =
    git@github.com:vakhrymchuk/arduino-base.git
    git@github.com:vakhrymchuk/PWMServo.git
    git@github.com:vakhrymchuk/distance-sensors.git
    VL53L0X
    VL53L1X
    TCA9548A


[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    Wire
    jrowberg/I2Cdevlib-MPU6050
    ESP32Servo
    kaiaai/LDS
    WiFi
    ArduinoJson
    ; ESP Async WebServer
    git@github.com:vakhrymchuk/PIDController.git
    git@github.com:vakhrymchuk/arduino-base.git
