<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://fonts.googleapis.com/css?family=Khand|Overpass+Mono" rel="stylesheet">
    <title>Roborace Subaru Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
    <div id="header">Subaru Control</div>
    <div id="content">

    </div>

    <div id="buttons">
        <div id="chart" class="block">
            <canvas id="myChart" width="500" height="400"></canvas>
        </div>
        <div id="control" class="block" style="display: none;width:50vw">

            <div id="tab-headers" class="tab"></div>
            <div id="tab-content"></div>


            <input type="button" class="btn-command" id="btn-send" value="Send" data-command="SEND">
            <input type="button" class="btn-command" id="btn-save" value="Save" data-command="SEND">
            <input type="button" class="btn-command" id="btn-read" value="Read" data-command="SEND">
        </div>


        <div id="config" class="block">
            <input type="text" id="ip" value="ws://192.168.1.215/ws">
            <input type="button" id="btn-connect" value="Connect">
        </div>
    </div>
</div>
<script src="Chart.min.js"></script>
<script src="script.js"></script>
</body>
</html>
